name: Deploy to GitHub Pages

# Astro 사이트를 빌드해 GitHub Pages에 배포한다.
#
# 이 저장소의 루트가 곧 Astro 프로젝트 루트라고 가정한다.
#
# ⚠️ 선행 조건: 저장소 Settings → Pages → Source 를 "GitHub Actions" 로 전환해야 한다.
#    전환 전에는 마지막 deploy 스텝이 실패한다 (빌드는 성공한다).
#
# ⚠️ 배포 URL 확인: 저장소 이름이 `<사용자명>.github.io` 가 아니면 프로젝트 사이트로
#    배포되어 URL이 `https://<사용자명>.github.io/<저장소명>/` 가 된다.
#    그 경우 astro.config.mjs 에 `base: '/<저장소명>'` 를 설정해야 링크와 에셋이 깨지지 않는다.
#
# 순서:
#   1. Settings → Pages → Source 를 "GitHub Actions" 로 전환
#   2. Actions 탭에서 이 워크플로를 수동 실행(Run workflow)해 배포 확인
#   3. 확인되면 아래 push 트리거의 주석을 해제해 자동 배포로 전환

on:
  workflow_dispatch:

  # 배포가 확인되면 주석을 해제한다.
  # push:
  #   branches: [main, master]

permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 동시 실행을 막되, 진행 중인 배포를 취소하지는 않는다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check content translations
        run: npm run check:i18n

      # build 스크립트가 astro check를 포함하므로 타입 검사까지 함께 수행된다.
      - name: Build
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
